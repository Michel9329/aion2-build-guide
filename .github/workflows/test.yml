name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm test
      - run: python -I tools/make_demo_fixture.py data/classes/gladiator/entities.json .demo/gladiator 11
      - run: python -I tools/verify_entities.py data/classes/gladiator/entities.json .demo/gladiator
      - run: python -I tools/mutate_entities.py data/classes/gladiator/entities.json .demo/gladiator .demo/tmp
      - run: AION_NO_SHOTS=1 npm run build
